<!DOCTYPE html>

<html lang="ms">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistem Giliran Balai</title>

    <style>

        body { font-family: Arial, sans-serif; text-align: center; background: #f4f7f6; padding: 20px; }

        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        h1 { color: #1a365d; }

        .number-display { font-size: 72px; font-weight: bold; color: #e53e3e; margin: 20px 0; background: #fff5f5; padding: 15px; border-radius: 8px; border: 2px dashed #feb2b2; }

        button { background: #3182ce; color: white; border: none; padding: 12px 24px; font-size: 18px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px; }

        button:hover { background: #2b6cb0; }

        .reset-btn { background: #718096; }

        .reset-btn:hover { background: #4a5568; }

    </style>

</head>

<body>



<div class="container">

    <h1>Sistem Giliran Balai</h1>

    <p>Nombor Giliran Semasa:</p>

    
    <!-- Large Queue Number Display -->

    <div class="number-display" id="queueNumber">0000</div>



    <button onclick="nextNumber()">Panggil Nombor Seterusnya</button>

    <br><br>
    <button class="reset-btn" onclick="resetQueue()">Reset Kaunter</button>
</div>



<!-- Firebase Modular Script SDK -->

<script type="module">

    import { initializeApp } from "https://gstatic.com";

    import { getDatabase, ref, set, onValue } from "https://gstatic.com";



    // 1. PASTE YOUR CONFIG BLOCK HERE ONCE YOU CLICK 'REGISTER APP'
    
const firebaseConfig = {

        apiKey: "AIzaSyDzR_aVqRuKQWTSeljaN-qHU2_lEeCgKr0",
  	authDomain: "giliran-balai-seri-iskandar.firebaseapp.com",
  	databaseURL: "https://giliran-balai-seri-iskandar-default-rtdb.asia-southeast1.firebasedatabase.app",
  	projectId: "giliran-balai-seri-iskandar",
  	storageBucket: "giliran-balai-seri-iskandar.firebasestorage.app",
  	messagingSenderId: "894844997172",
  	appId: "1:894844997172:web:5a7329add085d6d6e1c461",
  	measurementId: "G-VE9QG28VWY"
    };

    

// Initialize Firebase Realtime Database

    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);

    const queueRef = ref(db, 'sistem_giliran/current');


    let currentNumber = 0;

    

// 2. Listen to changes in real-time (Updates across all screens instantly!)

    onValue(queueRef, (snapshot) => {

        const data = snapshot.val();

        currentNumber = data ? data.number : 0;
        
        

// Formats number to 4 digits (e.g., 0005)

        document.getElementById("queueNumber").innerText = String(currentNumber).padStart(4, '0');
    });

    

// 3. Action to push next token number


    window.nextNumber = function() {

        set(queueRef, {

            number: currentNumber + 1,

            lastUpdated: Date.now()
        });

    };

    

// 4. Action to clear back to zero

    window.resetQueue = function() {

        if(confirm("Adakah anda pasti mahu set semula nombor giliran kepada 0000?")) {

            set(queueRef, {

                number: 0,

                lastUpdated: Date.now()

            });

        }
    };

</script>


</body>

</html>
