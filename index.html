<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Tiket Digital Balai Polis Seri Iskandar</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f0f4f8; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; max-width: 350px; width: 100%; box-sizing: border-box; border-top: 6px solid #003366; }
        .live-no { font-size: 24px; font-weight: bold; color: #e53e3e; }
        button { background-color: #003366; color: white; border: none; padding: 14px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 15px; }
        input { width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; border-radius: 8px; border: 1px solid #cbd5e0; box-sizing: border-box; }
        .nombor-anda { font-size: 56px; font-weight: bold; color: #2f855a; margin: 15px 0; }
    </style>
</head>
<body>

<div class="card">
    <h2>Balai Polis Seri Iskandar</h2>
    <p>Sila masukkan nama untuk urusan rasmi balai.</p>
    
    <div id="borang-pendaftaran">
        <input type="text" id="namaPelanggan" placeholder="Nama Penuh Anda" required>
        <button id="btnAmbil" onclick="semakLokasiDanAmbil()">Ambil Tiket Giliran</button>
    </div>

    <div id="paparan-tiket" style="display:none;">
        <p>Nombor Tiket Anda:</p>
        <div class="nombor-anda" id="noTiket">---</div>
        <p>Nama: <strong id="namaTiket">-</strong></p>
        <p style="color:#666;">Sila tunggu sehingga nombor anda dipanggil oleh pegawai kaunter.</p>
    </div>
</div>

<script>
    // URL Pangkalan Data Rasmi Anda yang Sah
    const FIREBASE_URL = "https://firebasedatabase.app";

    // Fungsi utama dipicu apabila butang "Ambil Tiket Giliran" ditekan
    function semakLokasiDanAmbil() {
        let nama = document.getElementById('namaPelanggan').value.trim();
        if (!nama) { 
            alert('Sila masukkan nama anda!'); 
            return; 
        }

        // Tukar status butang menjadi memproses
        document.getElementById('btnAmbil').innerText = "⏳ Memproses...";
        document.getElementById('btnAmbil').disabled = true;

        // PENGUBAHSUAIAN: Alamat URL terus yang digabungkan secara selamat untuk REST API Firebase
        const TARGET_URL = "https://firebasedatabase.applast_number.json";

        // Ambil data nombor terakhir dari Firebase
        fetch(TARGET_URL)
            .then(res => {
                if (!res.ok) {
                    throw new Error("Respons rangkaian tidak berjaya");
                }
                return res.json();
            })
            .then(lastNumber => {
                // Jika database masih kosong (null), mulakan dari siri 1001
                let nextNumber = lastNumber ? parseInt(lastNumber) + 1 : 1001;

                // Hantar dan kemaskini nombor giliran baharu ke Firebase
                fetch(TARGET_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(nextNumber)
                }).then(() => {
                    // Paparkan tiket dengan jaya pada skrin peranti pelanggan
                    document.getElementById('borang-pendaftaran').style.display = 'none';
                    document.getElementById('paparan-tiket').style.display = 'block';
                    document.getElementById('noTiket').innerText = nextNumber;
                    document.getElementById('namaTiket').innerText = nama;
                }).catch(err => {
                    alert("Gagal mengemas kini data baharu ke Firebase.");
                    resetButangAsal();
                });
            }).catch(err => {
                alert("Ralat sambungan database. Sila pastikan pautan URL Firebase ditaip dengan betul tanpa kesilapan ejaan.");
                resetButangAsal();
            });
    }

    function resetButangAsal() {
        document.getElementById('btnAmbil').innerText = "Ambil Tiket Giliran";
        document.getElementById('btnAmbil').disabled = false;
    }
</script>


</body>
</html>
